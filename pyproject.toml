[project]
name = "investment"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
    "ipython",
    "jupyter",
    "matplotlib",
    "numpy",
    "openpyxl",
    "pandas",
    "tqdm",
    "xlrd",
    "yfinance",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[dependency-groups]
dev = [
    "pip-audit>=2.10.1",
    "ruff>=0.17.5",
]
